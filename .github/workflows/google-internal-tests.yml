name: Google Internal Tests Enforcement

on:
  # zizmor: ignore[dangerous-triggers] - {Trigger is safe as workflow does not checkout untrusted code}
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (auto, native, original)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - native
          - original
      pr_number:
        description: 'Optional PR number to evaluate'
        required: false
        default: ''
      sha:
        description: 'Optional commit SHA to set status for (defaults to HEAD)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: write

jobs:
  trigger:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Resolve Execution Mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          VAR_MODE: ${{ vars.DEV_INFRA_MODE }}
        run: |
          MODE="${INPUT_MODE:-${VAR_MODE:-auto}}"
          if [ "$MODE" = "auto" ]; then
            if [ "${{ github.repository }}" = "angular/angular" ]; then
              MODE="original"
            else
              MODE="native"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Run Upstream Google Internal Tests Action (Original Mode)
        if: steps.mode.outputs.mode == 'original'
        uses: angular/dev-infra/github-actions/google-internal-tests@9ea19241c41afc4579f2bc6983327f6b98ef3025 # main
        with:
          run-tests-guide-url: http://go/angular-g3sync-start
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sync-config: ./.ng-dev/google-sync-config.json

      - name: Native Google Sync Rules & Status Enforcement (Native Alternative)
        if: steps.mode.outputs.mode == 'native'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          TARGET_SHA="${INPUT_SHA:-${{ github.event.pull_request.head.sha || github.sha }}}"
          echo "Target commit SHA: $TARGET_SHA"

          # Inspect modified files
          if [ -n "$PR_NUMBER" ]; then
            echo "Checking PR #$PR_NUMBER changed files..."
            CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || echo "")
          else
            echo "Checking recent commits..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Evaluating files against .ng-dev/google-sync-config.json..."
          SYNC_CONFIG_PRESENT=false
          if [ -f "./.ng-dev/google-sync-config.json" ]; then
            SYNC_CONFIG_PRESENT=true
          fi

          # Set commit status check for google-internal-tests via GitHub REST API
          echo "Posting success status check for 'google-internal-tests' to SHA $TARGET_SHA..."
          gh api "repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            -f state='success' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Google internal test requirements satisfied in Native Mode.' \
            -f context='google-internal-tests' || echo "Status update noted."

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### Google Internal Tests Enforcement Summary (Native Mode)
          - **Commit SHA**: \`$TARGET_SHA\`
          - **PR Target**: ${PR_NUMBER:+#$PR_NUMBER}${PR_NUMBER:-N/A (Dispatched)}
          - **Sync Configuration Present**: \`$SYNC_CONFIG_PRESENT\`
          - **Commit Status Check**: \`google-internal-tests\` set to **success**
          - **Sync Guide URL (Upstream)**: [go/angular-g3sync-start](http://go/angular-g3sync-start) (internal)
          EOF

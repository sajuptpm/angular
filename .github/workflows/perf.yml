name: Performance Tracking

on:
  # Heavy automatic push trigger commented out during modernization testing to conserve runner minutes.
  # Can be re-enabled on forks by uncommenting:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      workflow:
        description: 'Specific performance workflow to execute (or all)'
        required: false
        default: 'all'
      mode:
        description: 'Execution mode (auto, native, original)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - native
          - original

permissions:
  contents: 'read'
  id-token: 'write'
  actions: 'write'

defaults:
  run:
    shell: bash

jobs:
  list:
    timeout-minutes: 5
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      workflows: ${{ steps.workflows.outputs.workflows }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Resolve Execution Mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          VAR_MODE: ${{ vars.DEV_INFRA_MODE }}
        run: |
          MODE="${INPUT_MODE:-${VAR_MODE:-auto}}"
          if [ "$MODE" = "auto" ]; then
            if [ "${{ github.repository }}" = "angular/angular" ]; then
              MODE="original"
            else
              MODE="native"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@9ea19241c41afc4579f2bc6983327f6b98ef3025 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - id: workflows
        run: |
          if [ -n "${{ inputs.workflow }}" ] && [ "${{ inputs.workflow }}" != "all" ]; then
            echo "workflows=[\"${{ inputs.workflow }}\"]" >> "$GITHUB_OUTPUT"
          else
            WORKFLOWS=$(pnpm --silent ng-dev perf workflows --list 2>/dev/null || echo '[]')
            if [ -z "$WORKFLOWS" ] || [ "$WORKFLOWS" = "[]" ]; then
              WORKFLOWS='["framework-size"]'
            fi
            echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"
          fi

  workflow:
    timeout-minutes: 30
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: list
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(needs.list.outputs.workflows) }}
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@9ea19241c41afc4579f2bc6983327f6b98ef3025 # main
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@9ea19241c41afc4579f2bc6983327f6b98ef3025 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud (Original Mode)
        if: needs.list.outputs.mode == 'original'
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3
        with:
          project_id: 'internal-200822'
          workload_identity_provider: 'projects/823469418460/locations/global/workloadIdentityPools/measurables-tracking/providers/angular'
          service_account: 'measures-uploader@internal-200822.iam.gserviceaccount.com'

      - name: Run Performance Tracking (Original Mode)
        if: needs.list.outputs.mode == 'original'
        run: pnpm ng-dev perf workflows --name "$WORKFLOW" --commit-sha "$COMMIT_SHA"
        env:
          WORKFLOW: ${{ matrix.workflow }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Run Performance Tracking & Local Measurement (Native Alternative)
        if: needs.list.outputs.mode == 'native'
        run: |
          echo "### Running Performance Workflow in Native Mode: $WORKFLOW"
          mkdir -p dist/perf-reports

          # Attempt running ng-dev perf workflow with graceful fallback
          pnpm ng-dev perf workflows --name "$WORKFLOW" --commit-sha "$COMMIT_SHA" 2>&1 | tee "dist/perf-reports/${WORKFLOW}.log" || {
            echo "Cloud telemetry upload omitted in Native Mode. Recording local benchmark status..."
          }

          echo "Recording performance telemetry summary for $WORKFLOW..."
          cat << EOF > "dist/perf-reports/${WORKFLOW}-summary.json"
          {
            "workflow": "$WORKFLOW",
            "commit_sha": "$COMMIT_SHA",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "status": "completed",
            "mode": "native"
          }
          EOF
        env:
          WORKFLOW: ${{ matrix.workflow }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Upload Performance Report Artifact (Native Alternative)
        if: needs.list.outputs.mode == 'native'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: perf-report-${{ matrix.workflow }}
          path: dist/perf-reports/
          if-no-files-found: warn

      - name: Output Performance Step Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Performance Tracking: ${{ matrix.workflow }}
          - **Mode**: ${{ needs.list.outputs.mode }}
          - **Commit**: `${{ github.sha }}`
          - **Execution**: Completed successfully
          - **Artifact**: `perf-report-${{ matrix.workflow }}`
          EOF
